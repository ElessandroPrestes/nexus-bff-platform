<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

@if (telaLogin()) {
  <main id="conteudo" tabindex="-1">
    <router-outlet />
  </main>
} @else {
  <div class="min-h-screen bg-bg lg:grid lg:grid-cols-[16rem_1fr]">
    <aside class="hidden border-r border-border bg-surface lg:flex lg:flex-col">
      <div class="flex h-16 items-center border-b border-border px-5">
        <a
          class="marca inline-flex items-center gap-2 font-bold text-text no-underline"
          routerLink="/dashboard"
          aria-label="Nexus — início"
        >
          <span
            class="grid h-8 w-8 place-items-center rounded-lg bg-brand text-brand-contrast"
            aria-hidden="true"
            >N</span
          >
          <span>Nexus</span>
        </a>
      </div>

      <nav class="flex-1 px-3 py-4" aria-label="Navegação principal">
        <ul class="nav m-0 flex list-none flex-col gap-1 p-0">
          <li>
            <a
              routerLink="/dashboard"
              routerLinkActive="bg-bg font-semibold text-text"
              ariaCurrentWhenActive="page"
              class="flex min-h-11 items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted no-underline transition-colors hover:bg-bg hover:text-text"
            >
              <svg
                viewBox="0 0 24 24"
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6V11h-6v9Zm0-13h6V4h-6v3Z" />
              </svg>
              Visão geral
            </a>
          </li>
          <li>
            <a
              routerLink="/acordos"
              routerLinkActive="bg-bg font-semibold text-text"
              ariaCurrentWhenActive="page"
              class="flex min-h-11 items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted no-underline transition-colors hover:bg-bg hover:text-text"
            >
              <svg
                viewBox="0 0 24 24"
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="M7 4h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2Z" />
                <path d="M9 9h6M9 13h6" />
              </svg>
              Acordos
            </a>
          </li>
        </ul>
      </nav>

      <div class="border-t border-border p-4">
        <p class="truncate text-sm font-semibold text-text">{{ usuario() }}</p>
        <p class="text-xs text-muted">Nexus Core</p>
      </div>
    </aside>

    <div class="flex min-h-screen flex-col">
      <header class="sticky top-0 z-30 border-b border-border bg-surface/95 shadow-sm backdrop-blur">
        <div class="flex h-16 items-center gap-3 px-4 sm:px-6">
          <button
            type="button"
            class="grid h-11 w-11 place-items-center rounded-lg border border-border text-text transition-colors hover:bg-bg lg:hidden"
            aria-label="Abrir menu"
            (click)="abrirMenu()"
          >
            <svg
              viewBox="0 0 24 24"
              class="h-5 w-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>

          <a
            class="marca inline-flex items-center gap-2 font-bold text-text no-underline lg:hidden"
            routerLink="/dashboard"
            aria-label="Nexus — início"
          >
            <span
              class="grid h-8 w-8 place-items-center rounded-lg bg-brand text-brand-contrast"
              aria-hidden="true"
              >N</span
            >
          </a>

          <form class="hidden max-w-sm flex-1 sm:block" role="search" (submit)="buscar($event)">
            <label for="busca-global" class="visually-hidden">Buscar acordos</label>
            <div class="relative">
              <svg
                viewBox="0 0 24 24"
                class="pointer-events-none absolute top-1/2 left-3 h-4 w-4 -translate-y-1/2 text-muted"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              <input
                id="busca-global"
                type="search"
                placeholder="Buscar acordos…"
                [value]="busca()"
                (input)="onBusca($event)"
                class="w-full rounded-xl border border-border bg-bg/60 py-2 pr-3 pl-9 text-sm text-text outline-none transition focus:border-transparent focus:ring-2 focus:ring-brand"
              />
            </div>
          </form>

          <div class="ml-auto flex items-center gap-2">
            <button
              type="button"
              class="grid h-11 w-11 place-items-center rounded-lg border border-border bg-transparent text-text transition-colors hover:bg-bg"
              [attr.aria-pressed]="theme.escuro()"
              [attr.aria-label]="theme.escuro() ? 'Ativar tema claro' : 'Ativar tema escuro'"
              (click)="theme.alternar()"
            >
              @if (theme.escuro()) {
                <svg
                  viewBox="0 0 24 24"
                  class="h-5 w-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="4" />
                  <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
              } @else {
                <svg
                  viewBox="0 0 24 24"
                  class="h-5 w-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z" />
                </svg>
              }
            </button>

            @if (auth.autenticado()) {
              <details class="relative">
                <summary
                  class="flex min-h-11 cursor-pointer list-none items-center gap-2 rounded-lg px-2 py-1.5 transition-colors hover:bg-bg"
                >
                  <span
                    class="grid h-8 w-8 place-items-center rounded-full bg-brand text-xs font-bold text-brand-contrast"
                    aria-hidden="true"
                    >{{ iniciais() }}</span
                  >
                  <span class="hidden max-w-40 truncate text-sm font-medium text-text md:block">{{
                    usuario()
                  }}</span>
                </summary>
                <div
                  class="absolute right-0 z-40 mt-2 w-56 rounded-xl border border-border bg-surface p-1 shadow-lg"
                >
                  <p class="truncate px-3 py-2 text-xs text-muted">{{ usuario() }}</p>
                  <button
                    type="button"
                    class="w-full rounded-lg px-3 py-2 text-left text-sm font-semibold text-danger transition-colors hover:bg-bg"
                    (click)="sair()"
                  >
                    Sair
                  </button>
                </div>
              </details>
            } @else {
              <a
                class="inline-flex items-center justify-center rounded-xl bg-brand px-3 py-2 text-sm font-semibold text-brand-contrast no-underline transition-opacity hover:opacity-90"
                routerLink="/login"
              >
                Entrar
              </a>
            }
          </div>
        </div>
      </header>

      <main id="conteudo" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6" tabindex="-1">
        <router-outlet />
      </main>
    </div>
  </div>

  <app-drawer [aberto]="menuAberto()" titulo="Navegação" lado="left" (fechar)="fecharMenu()">
    <nav aria-label="Navegação principal (mobile)">
      <ul class="nav m-0 flex list-none flex-col gap-1 p-0">
        <li>
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-bg font-semibold text-text"
            ariaCurrentWhenActive="page"
            class="flex min-h-11 items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted no-underline transition-colors hover:bg-bg hover:text-text"
            (click)="fecharMenu()"
          >
            Visão geral
          </a>
        </li>
        <li>
          <a
            routerLink="/acordos"
            routerLinkActive="bg-bg font-semibold text-text"
            ariaCurrentWhenActive="page"
            class="flex min-h-11 items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted no-underline transition-colors hover:bg-bg hover:text-text"
            (click)="fecharMenu()"
          >
            Acordos
          </a>
        </li>
      </ul>
    </nav>
  </app-drawer>
}

<app-notification-list />
